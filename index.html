<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Xmas boyfriend (il est un peu taré dsl)</title>
    <style>
        body { font-family: Arial; background:#f2f2f2; }
        #login, #chat { max-width:400px; margin: 2rem auto; padding:20px; background:white; border-radius:10px; }
        #chat { display:none; }
        #messages { height:300px; overflow-y:auto; border:1px solid #ccc; padding:10px; margin-bottom:10px; }
        .msg { margin:5px 0; padding:8px; border-radius:5px; }
        .you { background:#d1e7ff; text-align:left; }
        .ia { background:#d9ffd9; text-align:right; }
    </style>
</head>
<body>

<div id="login">
    <h2>Accès secret !!</h2>
    <input id="pwd" type="password" placeholder="Mot de passe">
    <button onclick="login()">Entrer</button>
    <p id="err" style="color:red;"></p>
</div>

<div id="chat">
    <h2>Chat</h2>
    <div id="messages"></div>
    <input id="msg" type="text" placeholder="Écris ton message...">
    <button onclick="sendMessage()">Envoyer</button>
</div>

<script>
const PASSWORD = "secretsanta";

function login() {
    const input = document.getElementById("pwd").value;
    if (input === PASSWORD) {
        document.getElementById("login").style.display = "none";
        document.getElementById("chat").style.display = "block";
    } else {
        document.getElementById("err").innerText = "Mauvais mot de passe !";
    }
}

function addMessage(text, sender) {
    const div = document.createElement("div");
    div.className = "msg " + sender;
    div.innerText = text;
    document.getElementById("messages").appendChild(div);
}

async function sendMessage() {
    const text = document.getElementById("msg").value;
    if (!text) return;

    addMessage(text, "you");
    document.getElementById("msg").value = "";

    try {
        const response = await fetch("https://secretsanta-chat-bend.onrender.com/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
        });

        if (!response.ok) {
            throw new Error("Erreur serveur : " + response.status);
        }

        const data = await response.json();
        addMessage(data.reply, "ia");
    } catch (err) {
        console.error(err);
        addMessage("Erreur : impossible de contacter le serveur.", "ia");
    }
}

</script>

</body>
</html>
